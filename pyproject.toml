[project]
name = "selfquant"
version = "0.1.0"
description = "Precision Patches: task-conditional quantization with a shared frozen base"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "datasets>=2.20",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
eval = ["lm-eval>=0.4"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
